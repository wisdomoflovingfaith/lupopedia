<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wolf Peer Login</title>
    <!--
        Standalone reference template (path: lupo-templates/login/).

        JS: ../../lupo-includes/js/lupo-layers.js — DynLayer-style API (moveTo, slideTo, clip*, write,
        show/hide, LupoLayerInit / DynLayerInit) without eval. See file header in lupo-layers.js.

        Production entry (PHP): root login.php loads the same script via LUPOPEDIA_PUBLIC_PATH.

        Optional init: call LupoLayerInit() then use globals header + login from ids headerDiv / loginDiv
        (same naming as legacy DynLayerInit). This file uses explicit new LupoLayer('…') in script.js.
    -->
    <link rel="stylesheet" href="style.css">
    <script src="../../lupo-includes/js/lupo-layers.js"></script>
    <script src="script.js"></script>
</head>
<body onload="initApp()">

    <div id="headerDiv" class="login-header">
        <img src="../../lupo-images/logo.png" alt="Wolf Logo" class="login-logo">
    </div>

    <div id="loginDiv" class="login-container">
        <form class="login-form">
            <h2>Sign In</h2>
            <div class="input-group">
                <label>Username</label>
                <input type="text" placeholder="Enter username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter password">
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>

</body>
</html>
