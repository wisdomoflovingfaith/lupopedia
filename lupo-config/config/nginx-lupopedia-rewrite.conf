# Nginx rewrite rules for Lupopedia 4.0.18 (T5)
# Include this inside your server { } block. Ensure a PHP location block exists (e.g. location ~ \.php$).
# Adjust fastcgi_pass path for your PHP version (e.g., /var/run/php5-fpm.sock for PHP 5.3 on Debian/Ubuntu).

# Funnel doctrine/qa/docs/flp to index.php with resolved_uri
location ~ ^/(doctrine|qa|docs|flp)/(.+)$ {
    try_files $uri /index.php?resolved_uri=$uri$is_args$args;
}

