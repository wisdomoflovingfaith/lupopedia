<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sync Preview — Unified Stream Hydration</title>
    <link rel="stylesheet" href="../ui/css/crafty-legacy.css">
    <style>
        .gold-border {
            border: 2px solid #FFD700 !important;
            box-shadow: 0 0 8px #FFD70044;
        }
        .truth-candidate {
            background: #fffbe6;
        }
    </style>
</head>
<body>
    <h1>Unified Stream Hydration Preview</h1>
    <div id="preview-container">
        <!-- Populated by hydration script -->
    </div>
    <script>
    // Example: Render preview from JSON (stub, replace with PHP or AJAX as needed)
    fetch('../database/lupopedia/json/lupo_dialog_messages.json')
      .then(r => r.json())
      .then(messages => {
        const container = document.getElementById('preview-container');
        messages.forEach(msg => {
          const div = document.createElement('div');
          div.className = 'message-preview' + (msg.is_truth_candidate ? ' gold-border truth-candidate' : '');
          div.innerHTML = `<strong>${msg.actor_id}</strong>: ${msg.content}`;
          container.appendChild(div);
        });
      });
    </script>
</body>
</html>
